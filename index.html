<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7964aa"><meta name="apple-mobile-web-app-capable" content="yes"><title>Cosplay Craft Manager</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#322d40;background:#f7f5fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#fff;padding:18px 16px 12px;position:sticky;top:0;z-index:3;border-bottom:1px solid #e8e2f1}h1{font-size:21px;margin:0;color:#675093}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}small,.muted{color:#817b8c}main{max-width:780px;margin:auto;padding:16px 14px 110px}.card{background:#fff;border:1px solid #eae5f1;border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #37275009}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;background:#7860a8;color:#fff;border-radius:11px;padding:10px 13px;font-weight:600}.btn.alt{background:#f0ebf8;color:#65508e}.btn.warn{background:#fff0f0;color:#ad4752}.btn.sm{padding:6px 9px;font-size:13px}.btn:disabled{opacity:.45}.pill{border-radius:99px;background:#f1edf8;color:#6d588e;padding:4px 8px;font-size:12px}.bar{height:8px;background:#eee9f4;border-radius:10px;overflow:hidden;margin:8px 0}.bar>div{height:100%;background:#9075c4}.item{padding:11px 0;border-top:1px solid #f0ecf5}.item:first-child{border-top:0}.titlelink{background:none;border:0;padding:0;color:#49356f;text-align:left;font-weight:700}.field{display:block;margin:12px 0;font-size:13px;font-weight:600}.field input,.field select,.field textarea{display:block;width:100%;border:1px solid #dcd5e8;border-radius:10px;padding:11px;margin-top:5px;background:white;color:#30293b}.field textarea{min-height:80px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e2ef;display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:#837b91;font-size:11px;padding:6px 3px}.nav button.active{color:#70539f;font-weight:800}.nav span{display:block;font-size:22px;margin-bottom:2px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.hint{font-size:12px;color:#8b8197}.danger{color:#b44755}.ok{color:#31836b}.thumb{max-width:100%;max-height:180px;border-radius:10px;object-fit:contain}.modal{position:fixed;inset:0;background:#221a32a6;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px}.panel{background:#fff;border-radius:18px;padding:18px;width:min(100%,560px);max-height:90dvh;overflow:auto}.panel h2{margin-bottom:12px}.check{width:21px;height:21px;accent-color:#7c61ad}.indent{margin-left:14px;border-left:2px solid #eee8f7;padding-left:12px}.empty{padding:18px;text-align:center;color:#92899d}.hidden{display:none!important}details summary{cursor:pointer;font-weight:700;padding:8px 0}a{color:#68529b}#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#332a44;color:#fff;border-radius:12px;padding:10px 15px;display:none;z-index:20;max-width:90%}
</style></head><body><header><div class="row between"><div><h1>✂️ Cosplay Craft Manager</h1><small id="subtitle">衣装制作を、楽しく着実に。</small></div><span class="pill" id="saveStatus">保存準備中</span></div></header><main id="app"></main><nav class="nav" id="nav"></nav><div id="overlay"></div><div id="toast"></div><script>
'use strict';
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()), today=()=>new Date().toLocaleDateString('sv-SE'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ja-JP'):'未設定', clamp=n=>Math.max(0,Math.min(100,Number(n)||0));
const tabs=[['home','🏠','ホーム'],['projects','👗','制作'],['calendar','📅','予定'],['materials','🧵','材料'],['settings','⚙️','設定']];
const statuses=['未着手','進行中','保留','修正中','完了'], priorities=['最優先','高','中','低'], categories=['衣装','ウィッグ','小道具・武器','靴・アクセサリー','メイク・カラコン'];
const defaultData=()=>({version:1,works:[],characters:[],projects:[],events:[],materials:[],diary:[],templates:[],trash:[],todayIds:[]});let db=null,data=defaultData(),tab='home',view=null,search='';
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800)}
function request(tx){return new Promise((ok,no)=>{tx.onsuccess=()=>ok(tx.result);tx.onerror=()=>no(tx.error)})}
async function initDB(){return new Promise((ok,no)=>{let r=indexedDB.open('cosplay-craft-manager',1);r.onupgradeneeded=()=>r.result.createObjectStore('store');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function save(){try{await request(db.transaction('store','readwrite').objectStore('store').put(data,'main'));$('#saveStatus').textContent='✓ 保存済み'}catch(e){$('#saveStatus').textContent='⚠ 未保存';alert('保存できませんでした。空き容量やブラウザ設定を確認し、バックアップしてください。\n'+e.message)}}
function collection(k){return data[k]||[]}function get(k,id){return collection(k).find(x=>x.id===id)}function children(p){return p.children||[]}function effective(p){if(p.manual!==null&&p.manual!==undefined)return clamp(p.manual);if(!p.children?.length)return 0;return Math.round(p.children.reduce((s,c)=>s+effective(c),0)/p.children.length)}function percent(p){return `<div class="row between"><small>${p.manual!=null?'手動':'自動'}進捗</small><b>${effective(p)}%</b></div><div class="bar"><div style="width:${effective(p)}%"></div></div>`}function statusBadge(p){return `<span class="pill">${esc(p.status||'未着手')}</span>`}function projectName(p){return `${get('works',p.workId)?.name||'作品未設定'} / ${get('characters',p.characterId)?.name||'キャラ未設定'} / ${p.name}`}
function task(name='新しい項目',kind='check'){return {id:uid(),name,kind,status:'未着手',priority:'中',due:'',manual:null,done:false,children:[]}}
function walk(p,fn){fn(p);for(const c of children(p))walk(c,fn)}function findNode(id){for(const p of data.projects){let result;walk(p,n=>{if(n.id===id)result=n});if(result)return {project:p,node:result}}return null}function parentNode(p,id){if(p.children?.some(c=>c.id===id))return p;for(const c of children(p)){let r=parentNode(c,id);if(r)return r}return null}
function collectTasks(p,arr=[]){walk(p,n=>{if(n.kind==='check')arr.push({node:n,project:p})});return arr}function days(d){if(!d)return Infinity;return Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)}function dueItems(){let a=[];for(const p of data.projects)walk(p,n=>{if(n.due&&n.status!=='完了'&&!(n.kind==='check'&&n.done)&&days(n.due)<=3)a.push({node:n,project:p})});return a.sort((a,b)=>priorities.indexOf(a.node.priority)-priorities.indexOf(b.node.priority)||days(a.node.due)-days(b.node.due))}
function nav(){ $('#nav').innerHTML=tabs.map(([id,ico,name])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${name}</button>`).join('')}
function go(t,id){tab=t;view=id||null;render();scrollTo(0,0)}function render(){nav();$('#subtitle').textContent=view?'詳細・編集':'衣装制作を、楽しく着実に。';$('#app').innerHTML=tab==='home'?home():tab==='projects'?projectsPage():tab==='calendar'?calendarPage():tab==='materials'?materialsPage():settingsPage()}
function home(){let active=data.projects.filter(p=>p.status!=='完了');let tasks=[];for(const p of data.projects)for(const t of collectTasks(p))if(!t.node.done&&(t.node.due&&days(t.node.due)<=3||data.todayIds.includes(t.node.id)))tasks.push(t);tasks=[...new Map(tasks.map(t=>[t.node.id,t])).values()];let ev=[...data.events].filter(e=>days(e.date)>=0).sort((a,b)=>days(a.date)-days(b.date))[0];return `<div class="sectionhead"><h2>ホーム</h2><button class="btn sm" onclick="openProjectForm()">＋ 衣装</button></div>${ev?`<div class="card"><small>次のイベントまで</small><h2>${days(ev.date)}日</h2><b>${esc(ev.name)}</b> · ${fmt(ev.date)}</div>`:''}<div class="card"><h3>今日の作業・期限間近</h3>${tasks.length?tasks.map(t=>checkRow(t.node,t.project)).join(''):'<div class="empty">今日の作業はありません</div>'}</div><div class="card"><h3>締め切りが危険な項目</h3>${dueItems().length?dueItems().slice(0,12).map(({node,project})=>`<div class="item row between"><div><span class="danger">${days(node.due)<0?'期限超過':`あと${days(node.due)}日`}</span> <b>${esc(node.name)}</b><br><small>${esc(project.name)}</small></div>${node.kind==='check'?`<button class="btn sm alt" onclick="toggleCheck('${node.id}')">✓ 完了</button>`:`<button class="btn sm alt" onclick="openNode('${node.id}')">開く</button>`}</div>`).join(''):'<div class="empty">危険な項目はありません</div>'}</div><div class="card"><h3>制作中の衣装</h3>${active.length?active.map(p=>`<div class="item"><button class="titlelink" onclick="go('projects','${p.id}')">${esc(p.name)}</button>${percent(p)}</div>`).join(''):'<div class="empty">衣装を登録しましょう</div>'}</div>`}
function checkRow(n,p){return `<div class="item row"><input class="check" type="checkbox" ${n.done?'checked':''} onchange="toggleCheck('${n.id}')"><div style="flex:1"><b>${esc(n.name)}</b><br><small>${esc(p.name)} ${n.due?'· '+fmt(n.due):''}</small></div><button class="btn sm alt" onclick="toggleToday('${n.id}')">${data.todayIds.includes(n.id)?'今日から外す':'今日に追加'}</button></div>`}
function projectsPage(){if(view){let p=get('projects',view);if(p)return projectDetail(p)}return `<div class="sectionhead"><h2>衣装プロジェクト</h2><button class="btn sm" onclick="openProjectForm()">＋ 新規</button></div><label class="field">検索<input placeholder="衣装名で検索" value="${esc(search)}" oninput="search=this.value;render()"></label>${data.projects.filter(p=>p.name.includes(search)).map(p=>`<div class="card"><div class="row between"><button class="titlelink" onclick="go('projects','${p.id}')">${esc(p.name)}</button>${statusBadge(p)}</div><small>${esc(projectName(p))}</small>${percent(p)}<div class="row"><button class="btn sm alt" onclick="openProjectForm('${p.id}')">編集</button><button class="btn sm alt" onclick="go('projects','${p.id}')">工程を見る</button></div></div>`).join('')||'<div class="card empty">衣装を追加してください</div>'}<div class="card"><h3>作品・キャラクター</h3><button class="btn alt sm" onclick="simpleForm('works','作品')">＋ 作品</button> <button class="btn alt sm" onclick="characterForm()">＋ キャラクター</button>${data.works.map(w=>`<div class="item"><b>${esc(w.name)}</b> <button class="btn sm alt" onclick="simpleForm('works','作品','${w.id}')">編集</button>${data.characters.filter(c=>c.workId===w.id).map(c=>`<div class="indent">${esc(c.name)} <button class="btn sm alt" onclick="characterForm('${c.id}')">編集</button></div>`).join('')}</div>`).join('')}</div>`}
function projectDetail(p){return `<div class="row between"><button class="btn sm alt" onclick="go('projects')">← 一覧</button><button class="btn sm alt" onclick="openProjectForm('${p.id}')">衣装編集</button></div><div class="card"><h2>${esc(p.name)}</h2><small>${esc(projectName(p))}</small>${statusBadge(p)}${percent(p)}<div class="row"><button class="btn sm alt" onclick="progressForm('${p.id}')">進捗設定</button><button class="btn sm alt" onclick="templateFrom('${p.id}')">テンプレ化</button><button class="btn sm warn" onclick="removeEntity('projects','${p.id}')">ゴミ箱へ</button></div></div><div class="sectionhead"><h2>制作対象・工程</h2><button class="btn sm" onclick="addNode('${p.id}')">＋ 制作対象</button></div>${p.children.map(n=>nodeHTML(n,0)).join('')||'<div class="card empty">制作対象を追加してください</div>'}<div class="card"><h3>参考画像・URL</h3><input type="file" accept="image/*" onchange="addImage(event,'${p.id}')"><p class="hint">画像は長辺1600px以内に縮小して端末内に保存します</p>${(p.images||[]).map(i=>`<div class="item"><img class="thumb" src="${i.src}" alt="参考画像"><button class="btn sm warn" onclick="deleteImage('${p.id}','${i.id}')">削除</button></div>`).join('')}<button class="btn sm alt" onclick="addReference('${p.id}')">＋ 参考URL</button>${(p.urls||[]).map(u=>`<div class="item"><a href="${esc(u.url)}" target="_blank" rel="noopener noreferrer">${esc(u.title||u.url)}</a> <button class="btn sm warn" onclick="deleteReference('${p.id}','${u.id}')">削除</button></div>`).join('')}</div><div class="card"><h3>作業日誌</h3><button class="btn sm alt" onclick="diaryForm('${p.id}')">＋ 記録</button>${data.diary.filter(d=>d.projectId===p.id).map(d=>`<div class="item"><b>${fmt(d.date)} ${esc(d.text)}</b><p>${esc(d.note)}</p><button class="btn sm alt" onclick="diaryForm('${p.id}','${d.id}')">編集</button></div>`).join('')}</div>`}
function nodeHTML(n,depth){let check=n.kind==='check';return `<div class="${depth?'indent':'card'}"><div class="item"><div class="row between">${check?`<label class="row"><input class="check" type="checkbox" ${n.done?'checked':''} onchange="toggleCheck('${n.id}')"><b>${esc(n.name)}</b></label>`:`<b>${esc(n.name)}</b>`}<span class="pill">${check?(n.done?'完了':'未完了'):`${effective(n)}%`}</span></div>${!check?percent(n):''}<div class="row"><button class="btn sm alt" onclick="openNode('${n.id}')">編集</button>${!check&&depth<3?`<button class="btn sm alt" onclick="addNode('${n.id}')">＋ ${['工程','サブ工程','チェック'][depth]}</button>`:''}<button class="btn sm alt" onclick="moveNode('${n.id}',-1)">↑</button><button class="btn sm alt" onclick="moveNode('${n.id}',1)">↓</button>${check?`<button class="btn sm alt" onclick="toggleToday('${n.id}')">${data.todayIds.includes(n.id)?'今日から外す':'今日に追加'}</button>`:''}</div></div>${n.children?.map(c=>nodeHTML(c,depth+1)).join('')||''}</div>`}
function calendarPage(){let events=[...data.events].sort((a,b)=>(a.date||'').localeCompare(b.date||''));let all=[];for(const p of data.projects)walk(p,n=>{if(n.due)all.push({n,p})});return `<div class="sectionhead"><h2>イベント・予定</h2><button class="btn sm" onclick="eventForm()">＋ イベント</button></div><div class="card"><h3>イベント</h3>${events.map(e=>`<div class="item"><div class="row between"><b>${esc(e.name)}</b><span class="pill">${fmt(e.date)}</span></div><small>${e.projectIds?.map(id=>esc(get('projects',id)?.name||'')).join('・')||'衣装未連携'}</small><div class="row"><button class="btn sm alt" onclick="eventForm('${e.id}')">編集</button><button class="btn sm warn" onclick="removeEntity('events','${e.id}')">削除</button></div></div>`).join('')||'<div class="empty">イベントなし</div>'}</div><div class="card"><h3>工程の期限（リスト）</h3>${all.sort((a,b)=>a.n.due.localeCompare(b.n.due)).map(({n,p})=>`<div class="item row between"><div><b>${esc(n.name)}</b><br><small>${esc(p.name)}</small></div><span class="pill">${fmt(n.due)}</span></div>`).join('')||'<div class="empty">期限未設定</div>'}</div>`}
function materialsPage(){return `<div class="sectionhead"><h2>材料・在庫</h2><button class="btn sm" onclick="materialForm()">＋ 材料</button></div><div class="card"><p class="hint">割当は予約量、消費は実在庫からの使用量です。利用可能量＝在庫−予約量。</p>${data.materials.map(m=>{let reserved=(m.alloc||[]).reduce((s,a)=>s+Number(a.qty||0),0);let avail=Number(m.stock||0)-reserved;return `<div class="item"><div class="row between"><b>${esc(m.name)}</b><span class="pill">${m.purchased?'購入済':'未購入'}</span></div><small>在庫 ${m.stock||0}${esc(m.unit||'個')} · 割当 ${reserved} · 利用可能 ${avail}</small><div class="row"><button class="btn sm alt" onclick="materialForm('${m.id}')">編集</button><button class="btn sm alt" onclick="allocationForm('${m.id}')">割当・消費</button><button class="btn sm warn" onclick="removeEntity('materials','${m.id}')">削除</button></div></div>`}).join('')||'<div class="empty">材料を登録してください</div>'}</div>`}
function settingsPage(){return `<h2>設定・データ保護</h2><div class="card"><h3>バックアップ</h3><p class="hint">画像を含むJSONをiCloud Driveなどへ保存できます。復元は置換方式です。現在のデータを先にバックアップしてください。</p><button class="btn" onclick="backup()">JSONを書き出す</button><label class="field">JSONから復元<input type="file" accept="application/json,.json" onchange="restore(event)"></label></div><div class="card"><h3>テンプレート</h3><p class="hint">衣装詳細から既存の制作対象・工程をテンプレート化できます。</p>${data.templates.map(t=>`<div class="item">${esc(t.name)} <button class="btn sm warn" onclick="removeEntity('templates','${t.id}')">削除</button></div>`).join('')||'<div class="empty">保存済みテンプレートなし</div>'}</div><div class="card"><h3>ゴミ箱</h3><p class="hint">自動削除されません。復元または完全削除できます。</p>${data.trash.map(t=>`<div class="item row between"><div><b>${esc(t.item.name||t.item.text||'項目')}</b><br><small>${esc(t.key)} · ${fmt(t.deleted)}</small></div><button class="btn sm alt" onclick="recover('${t.id}')">復元</button><button class="btn sm warn" onclick="purge('${t.id}')">完全削除</button></div>`).join('')||'<div class="empty">ゴミ箱は空です</div>'}</div><div class="card"><h3>このアプリについて</h3><p>Cosplay Craft Manager v1.0</p><small>保存先：この端末のブラウザ（IndexedDB）。Safariのサイトデータ削除等で消える可能性があります。定期的にJSONバックアップしてください。</small></div>`}
function modal(title,html,onSubmit){$('#overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="panel"><div class="row between"><h2>${esc(title)}</h2><button class="btn alt sm" onclick="closeModal()">閉じる</button></div><form id="editor">${html}<div class="row"><button class="btn" type="submit">保存</button><button class="btn alt" type="button" onclick="closeModal()">キャンセル</button></div></form></div></div>`;$('#editor').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target))}}
function closeModal(){$('#overlay').innerHTML=''}function field(label,name,val='',type='text',required=false){return `<label class="field">${label}<input type="${type}" name="${name}" value="${esc(val)}" ${required?'required':''}></label>`}function area(label,name,val=''){return `<label class="field">${label}<textarea name="${name}">${esc(val)}</textarea></label>`}function selectField(label,name,options,val){return `<label class="field">${label}<select name="${name}">${options.map(o=>`<option value="${esc(o.id??o)}" ${String(o.id??o)===String(val)?'selected':''}>${esc(o.name??o)}</option>`).join('')}</select></label>`}function optStatus(p){return selectField('ステータス','status',statuses,p.status||'未着手')+selectField('優先度','priority',priorities,p.priority||'中')+field('期限','due',p.due||'','date')}
function simpleForm(key,title,id){let o=get(key,id)||{};modal(title,field('名前','name',o.name,'text',true),f=>{if(o.id)o.name=f.get('name');else data[key].push({id:uid(),name:f.get('name')});save();closeModal();render()})}
function characterForm(id){let o=get('characters',id)||{};if(!data.works.length)return alert('先に作品を登録してください');modal('キャラクター',field('名前','name',o.name,'text',true)+selectField('作品','workId',data.works,o.workId),f=>{if(o.id)Object.assign(o,{name:f.get('name'),workId:f.get('workId')});else data.characters.push({id:uid(),name:f.get('name'),workId:f.get('workId')});save();closeModal();render()})}
function openProjectForm(id){let p=get('projects',id)||{};let w=data.works,c=data.characters;if(!w.length||!c.length)return alert('先に作品とキャラクターを登録してください');let html=field('衣装名','name',p.name,'text',true)+selectField('作品','workId',w,p.workId||w[0].id)+selectField('キャラクター','characterId',c,p.characterId||c[0].id)+optStatus(p)+area('メモ','note',p.note||'')+(!id?selectField('初期テンプレート','template',[{id:'standard',name:'標準（5つの制作対象）'},{id:'empty',name:'空の衣装'},...data.templates], 'standard'):'');modal('衣装プロジェクト',html,f=>{let props={name:f.get('name'),workId:f.get('workId'),characterId:f.get('characterId'),status:f.get('status'),priority:f.get('priority'),due:f.get('due'),note:f.get('note')};if(!data.characters.some(x=>x.id===props.characterId&&x.workId===props.workId))return alert('作品とキャラクターの組み合わせを確認してください');if(id)Object.assign(p,props);else{let template=f.get('template');let nodes=template==='standard'?categories.map(n=>task(n,'target')):template==='empty'?[]:JSON.parse(JSON.stringify(get('templates',template)?.nodes||[]));let renew=n=>{n.id=uid();n.manual=null;n.done=false;n.status='未着手';n.children?.forEach(renew)};nodes.forEach(renew);p={id:uid(),...props,kind:'project',manual:null,children:nodes,images:[],urls:[]};data.projects.push(p)}save();closeModal();go('projects',p.id)})}
function addNode(parentId){let found=findNode(parentId);let parent=found?.node||get('projects',parentId);if(!parent)return;let kind=parent.kind==='project'?'target':parent.kind==='target'?'process':parent.kind==='process'?'sub':'check';modal('項目の追加',field('名前','name','','text',true)+optStatus({}),f=>{let n=task(f.get('name'),kind);Object.assign(n,{status:f.get('status'),priority:f.get('priority'),due:f.get('due')});parent.children.push(n);save();closeModal();render()})}
function openNode(id){let found=findNode(id);if(!found)return;let n=found.node;modal('項目の編集',field('名前','name',n.name,'text',true)+optStatus(n)+(n.kind!=='check'?selectField('進捗モード','mode',[{id:'auto',name:'自動計算'},{id:'manual',name:'手動入力'}],n.manual==null?'auto':'manual')+field('手動進捗（0〜100）','manual',n.manual??effective(n),'number'):'')+`<button type="button" class="btn warn sm" onclick="deleteNode('${id}')">ゴミ箱へ</button>`,f=>{n.name=f.get('name');n.status=f.get('status');n.priority=f.get('priority');n.due=f.get('due');if(n.kind!=='check')n.manual=f.get('mode')==='manual'?clamp(f.get('manual')):null;save();closeModal();render()})}
function progressForm(id){let n=get('projects',id);modal('進捗設定',selectField('モード','mode',[{id:'auto',name:'自動計算'},{id:'manual',name:'手動入力'}],n.manual==null?'auto':'manual')+field('手動進捗','manual',n.manual??effective(n),'number'),f=>{n.manual=f.get('mode')==='manual'?clamp(f.get('manual')):null;save();closeModal();render()})}
function toggleCheck(id){let r=findNode(id);if(!r)return;r.node.done=!r.node.done;r.node.status=r.node.done?'完了':'未着手';save();render()}function toggleToday(id){data.todayIds=data.todayIds.includes(id)?data.todayIds.filter(x=>x!==id):[...data.todayIds,id];save();render()}function moveNode(id,dir){let f=findNode(id);if(!f)return;let parent=parentNode(f.project,id);let a=parent?.children||[];let i=a.findIndex(n=>n.id===id),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function deleteNode(id){let f=findNode(id);if(!f)return;let parent=parentNode(f.project,id);if(!parent||!confirm('この項目と配下の項目をゴミ箱に移しますか？'))return;let i=parent.children.findIndex(n=>n.id===id),item=parent.children.splice(i,1)[0];data.trash.push({id:uid(),key:'node',item,projectId:f.project.id,parentId:parent.id,index:i,deleted:today()});save();closeModal();render()}
function removeEntity(key,id){if(!confirm('ゴミ箱へ移動しますか？'))return;let a=data[key],i=a.findIndex(x=>x.id===id);if(i<0)return;let item=a.splice(i,1)[0];data.trash.push({id:uid(),key,item,index:i,deleted:today()});save();if(key==='projects')view=null;render()}
function recover(id){let i=data.trash.findIndex(t=>t.id===id),t=data.trash[i];if(!t)return;if(t.key==='node'){let p=get('projects',t.projectId);let parent=p&&(p.id===t.parentId?p:findNode(t.parentId)?.node);if(!parent)return alert('復元先の親項目がありません。先に親を復元してください。');parent.children.splice(Math.min(t.index,parent.children.length),0,t.item)}else data[t.key].splice(Math.min(t.index,data[t.key].length),0,t.item);data.trash.splice(i,1);save();render()}function purge(id){if(!confirm('完全削除します。元に戻せません。よろしいですか？'))return;data.trash=data.trash.filter(t=>t.id!==id);save();render()}
function eventForm(id){let e=get('events',id)||{};modal('イベント',field('イベント名','name',e.name,'text',true)+field('日付','date',e.date||today(),'date',true)+field('場所','place',e.place)+area('メモ','note',e.note)+`<div class="field">関連衣装${data.projects.map(p=>`<label style="display:block;margin:8px"><input type="checkbox" name="projectIds" value="${p.id}" ${(e.projectIds||[]).includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div>`,f=>{let props={name:f.get('name'),date:f.get('date'),place:f.get('place'),note:f.get('note'),projectIds:f.getAll('projectIds')};if(id)Object.assign(e,props);else data.events.push({id:uid(),...props});save();closeModal();render()})}
function materialForm(id){let m=get('materials',id)||{};modal('材料',field('材料名','name',m.name,'text',true)+field('在庫数量','stock',m.stock||0,'number')+field('必要数量','needed',m.needed||0,'number')+field('単位','unit',m.unit||'個')+field('購入先','shop',m.shop)+field('購入URL','url',m.url,'url')+selectField('購入状況','purchased',[{id:'no',name:'未購入'},{id:'yes',name:'購入済'}],m.purchased?'yes':'no'),f=>{let stock=Number(f.get('stock'));if(stock<0)return alert('在庫は0以上にしてください');let reserved=(m.alloc||[]).reduce((s,a)=>s+Number(a.qty),0);if(stock<reserved)return alert('割当量より在庫を少なくできません');let props={name:f.get('name'),stock,needed:Number(f.get('needed'))||0,unit:f.get('unit'),shop:f.get('shop'),url:f.get('url'),purchased:f.get('purchased')==='yes'};if(id)Object.assign(m,props);else data.materials.push({id:uid(),...props,alloc:[]});save();closeModal();render()})}
function allocationForm(id){let m=get('materials',id);if(!data.projects.length)return alert('先に衣装を登録してください');let html=selectField('衣装','projectId',data.projects,data.projects[0].id)+field('割当または消費数量','qty','1','number')+selectField('操作','action',[{id:'reserve',name:'割当（予約）'},{id:'consume',name:'消費（在庫を減らす）'},{id:'release',name:'割当解除'}],'reserve')+`<p class="hint">消費時はその衣装の割当量から差し引き、実在庫も減らします。</p>`;modal('材料の割当・消費',html,f=>{let projectId=f.get('projectId'),qty=Number(f.get('qty')),action=f.get('action');if(!Number.isFinite(qty)||qty<=0)return alert('正の数量を入力してください');let a=m.alloc.find(x=>x.projectId===projectId);if(!a){a={projectId,qty:0};m.alloc.push(a)}let reserved=m.alloc.reduce((s,x)=>s+x.qty,0);if(action==='reserve'){if(qty>m.stock-reserved)return alert('利用可能な在庫が不足しています');a.qty+=qty}else if(action==='release'){if(qty>a.qty)return alert('割当量を超えています');a.qty-=qty}else{if(qty>a.qty||qty>m.stock)return alert('割当量または在庫が不足しています');a.qty-=qty;m.stock-=qty}m.alloc=m.alloc.filter(x=>x.qty>0);save();closeModal();render()})}
function diaryForm(projectId,id){let d=get('diary',id)||{};modal('作業日誌',field('日付','date',d.date||today(),'date')+field('作業内容','text',d.text,'text',true)+area('メモ','note',d.note)+selectField('紐づけ先','nodeId',[{id:'',name:'衣装全体'},...(()=>{let a=[];walk(get('projects',projectId),n=>{if(n.id!==projectId)a.push(n)});return a})()],d.nodeId||''),f=>{let props={projectId,date:f.get('date'),text:f.get('text'),note:f.get('note'),nodeId:f.get('nodeId')};if(id)Object.assign(d,props);else data.diary.push({id:uid(),...props});save();closeModal();render()})}
function templateFrom(id){let p=get('projects',id);let name=prompt('テンプレート名',p.name+'の工程');if(!name)return;data.templates.push({id:uid(),name,nodes:JSON.parse(JSON.stringify(p.children))});save();toast('テンプレートを保存しました')}
function addReference(id){let title=prompt('参考資料名');if(title===null)return;let url=prompt('参考URL（https://...）');if(!url)return;try{let u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error();}catch{return alert('http/httpsのURLを入力してください')}get('projects',id).urls.push({id:uid(),title,url});save();render()}function deleteReference(id,ref){let p=get('projects',id);p.urls=p.urls.filter(x=>x.id!==ref);save();render()}
async function addImage(e,id){let file=e.target.files[0];if(!file)return;try{let img=await createImageBitmap(file);let scale=Math.min(1,1600/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let src=canvas.toDataURL('image/jpeg',.82);get('projects',id).images.push({id:uid(),src});await save();render()}catch(err){alert('画像を登録できませんでした: '+err.message)}}function deleteImage(id,img){if(!confirm('画像を削除しますか？'))return;let p=get('projects',id);p.images=p.images.filter(x=>x.id!==img);save();render()}
function backup(){let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CosplayCraftManager_'+today().replaceAll('-','')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('ファイルアプリに保存してください')}
async function restore(e){let file=e.target.files[0];if(!file)return;try{let incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.projects)||!Array.isArray(incoming.works))throw Error('形式が異なります');if(!confirm('現在のデータをすべて置き換えます。先にバックアップしましたか？'))return;data={...defaultData(),...incoming};await save();render();toast('復元しました')}catch(err){alert('復元に失敗しました: '+err.message)}}
(async()=>{try{db=await initDB();let old=await request(db.transaction('store').objectStore('store').get('main'));if(old)data={...defaultData(),...old};$('#saveStatus').textContent='✓ 保存済み';render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#saveStatus').textContent='⚠ 保存不可';$('#app').innerHTML='<div class="card">このブラウザでは保存領域を利用できません。Safariの通常モードで開いてください。</div>';console.error(e)}})();
</script></body></html>
