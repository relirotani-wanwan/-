<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7959ad">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cosplay Craft Manager</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --bg:#f7f5fb;--card:#fff;--text:#302a3e;
  --muted:#888095;--primary:#7959ad;--soft:#f0eafb;
  --border:#eae5f2;--red:#bf5265;--green:#368c73;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#ffffffed;
  backdrop-filter:blur(15px);padding:16px;border-bottom:1px solid var(--border)}
h1{font-size:19px;margin:0;color:#594078}
h2{font-size:20px;margin:0 0 13px}
h3{font-size:16px;margin:0 0 10px}
small,.muted{color:var(--muted)}
main{max-width:850px;margin:auto;padding:17px 14px 120px}
.card{background:var(--card);border:1px solid var(--border);
  border-radius:21px;padding:17px;margin-bottom:14px;
  box-shadow:0 7px 24px #4732670c}
.hero{background:linear-gradient(120deg,#7354aa,#ad8bd5);color:white}
.hero small{color:#f1e9ff}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;background:var(--primary);
  color:white;padding:10px 13px;font-weight:650}
.btn.alt{background:var(--soft);color:#674b95}
.btn.danger{background:#fff0f1;color:var(--red)}
.btn.sm{padding:7px 10px;font-size:12px}
.pill{background:var(--soft);color:#674d96;
  border-radius:30px;padding:5px 9px;font-size:12px}
.bar{height:9px;border-radius:20px;background:#eee9f5;overflow:hidden;margin:9px 0}
.bar div{height:100%;background:linear-gradient(90deg,#b59ae4,#7959ad)}
.item{padding:12px 0;border-top:1px solid #f0edf5}
.item:first-child{border-top:0}
.field{display:block;margin:12px 0;font-size:13px;font-weight:650}
.field input,.field select,.field textarea{
  display:block;width:100%;padding:11px;border:1px solid #ddd5ea;
  border-radius:11px;margin-top:6px;background:white;color:var(--text)}
.field textarea{min-height:80px}
.nav{position:fixed;bottom:8px;left:9px;right:9px;z-index:6;
  display:flex;background:#fffffff2;border:1px solid var(--border);
  border-radius:22px;padding:7px 3px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 8px 30px #30204c23}
.nav button{flex:1;min-width:0;background:none;border:0;color:#898092;
  font-size:10px;padding:5px 1px}
.nav button.active{color:var(--primary);font-weight:800}
.nav span{display:block;font-size:20px;margin-bottom:3px}
.section{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin:21px 0 11px}
.section h2{margin:0}
.clickable{cursor:pointer}
.clickable:active{opacity:.7}
.check{width:22px;height:22px;accent-color:var(--primary)}
.nested{border-left:2px solid #e9e1f5;margin-left:12px;padding-left:12px}
.node{padding:12px 0;border-top:1px solid #eeeaf4}
.node:first-child{border-top:0}
.node select{border:1px solid #e3daef;border-radius:9px;padding:6px;
  background:#faf8fe;color:#624c85;font-size:12px}
.modal{position:fixed;inset:0;z-index:20;background:#21172f9e;
  display:flex;align-items:center;justify-content:center;padding:14px}
.panel{background:white;width:min(100%,560px);max-height:90dvh;
  overflow:auto;border-radius:22px;padding:19px}
.empty{text-align:center;color:var(--muted);padding:20px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.week{text-align:center;color:var(--muted);font-size:11px;padding:5px}
.day{min-height:54px;background:white;border:1px solid var(--border);
  border-radius:11px;padding:6px 2px;text-align:center;font-size:13px}
.day.today{background:#f0e8ff;border-color:#b9a1df}
.day.selected{outline:2px solid var(--primary)}
.day.blank{background:transparent;border-color:transparent}
.dots{display:flex;justify-content:center;gap:3px;margin-top:7px}
.dot{width:5px;height:5px;border-radius:50%;background:#9274c9}
.dot.event{background:#e99aa6}
.thumb{max-width:100%;max-height:180px;border-radius:11px}
a{color:var(--primary)}
#toast{position:fixed;z-index:30;bottom:95px;left:50%;
  transform:translateX(-50%);background:#342942;color:white;
  padding:12px 17px;border-radius:12px;display:none}
</style>
</head>
<body>
<header>
 <div class="row between">
  <div>
   <h1>✂️ Cosplay Craft Manager</h1>
   <small id="subtitle">好きな衣装を、少しずつ形に。</small>
  </div>
  <span class="pill" id="saveStatus">読込中</span>
 </div>
</header>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<div id="overlay"></div>
<div id="toast"></div>

<script>
"use strict";

const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
const today=()=>localDate(new Date());
const localDate=d=>{
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0");
 return `${y}-${m}-${String(d.getDate()).padStart(2,"0")}`;
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("ja-JP"):"未設定";
const statuses=["未着手","進行中","保留","修正中","完了"];
const priorities=["最優先","高","中","低"];
const categories=["衣装","ウィッグ","小道具・武器","靴・アクセサリー","メイク・カラコン"];
const tabs=[
 ["home","🏠","ホーム"],
 ["projects","👗","制作"],
 ["masters","🎭","作品"],
 ["calendar","📅","予定"],
 ["materials","🧵","材料"],
 ["settings","⚙️","設定"]
];

const blank=()=>({
 version:1,works:[],characters:[],projects:[],events:[],
 materials:[],diary:[],templates:[],trash:[],todayIds:[]
});

let db,data=blank(),tab="home",view=null,search="";
let month=new Date().getMonth(),year=new Date().getFullYear();
let selectedDate=today();

function toast(s){
 $("#toast").textContent=s;
 $("#toast").style.display="block";
 setTimeout(()=>$("#toast").style.display="none",2600);
}
function request(r){
 return new Promise((resolve,reject)=>{
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}
async function initDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open("cosplay-craft-manager",1);
  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains("store"))
    r.result.createObjectStore("store");
  };
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}
async function save(){
 try{
  await request(db.transaction("store","readwrite")
   .objectStore("store").put(data,"main"));
  $("#saveStatus").textContent="✓ 保存済み";
 }catch(e){
  $("#saveStatus").textContent="⚠ 保存失敗";
  alert("保存に失敗しました: "+e.message);
 }
}
const get=(key,id)=>(data[key]||[]).find(x=>x.id===id);
const kids=n=>n.children||[];
function walk(n,fn){
 fn(n);
 kids(n).forEach(c=>walk(c,fn));
}
function findNode(id){
 for(const p of data.projects){
  let found=null;
  walk(p,n=>{if(n.id===id)found=n});
  if(found)return {project:p,node:found};
 }
 return null;
}
function parentOf(n,id){
 if(kids(n).some(x=>x.id===id))return n;
 for(const c of kids(n)){
  const p=parentOf(c,id);
  if(p)return p;
 }
 return null;
}
function makeNode(name,kind){
 return {id:uid(),name,kind,status:"未着手",priority:"中",
  due:"",manual:null,done:false,children:[]};
}
function isDone(n){
 return n.kind==="check"||n.kind==="sub"?
  !!n.done:n.status==="完了"||!!n.done;
}
function progress(n){
 if(n.kind==="project"){
  if(!kids(n).length)return 0;
  return kids(n).reduce((s,c)=>s+progress(c),0)/kids(n).length;
 }
 if(n.kind==="target"){
  if(!kids(n).length)return 0;
  return kids(n).filter(isDone).length/kids(n).length*100;
 }
 return isDone(n)?100:0;
}
function percent(n){
 const v=Math.round(progress(n));
 return `<div class="row between"><small>自動進捗</small><b>${v}%</b></div>
 <div class="bar"><div style="width:${v}%"></div></div>`;
}
function badge(s){
 return `<span class="pill">${esc(s||"未着手")}</span>`;
}
function projectLabel(p){
 return [
  get("works",p.workId)?.name,
  get("characters",p.characterId)?.name
 ].filter(Boolean).join(" / ");
}
function days(d){
 if(!d)return Infinity;
 return Math.round((new Date(d+"T00:00:00")-
  new Date(today()+"T00:00:00"))/86400000);
}
function allDue(){
 const result=[];
 data.projects.forEach(p=>walk(p,n=>{
  if(n.due&&!(n.kind==="check"?n.done:n.kind==="sub"?n.done:n.status==="完了"))
   result.push({node:n,project:p});
 }));
 return result.sort((a,b)=>a.node.due.localeCompare(b.node.due));
}
function go(t,id=null){
 tab=t;view=id;render();window.scrollTo(0,0);
}
function render(){
 $("#nav").innerHTML=tabs.map(([id,ico,label])=>
  `<button class="${tab===id?"active":""}" onclick="go('${id}')">
   <span>${ico}</span>${label}</button>`).join("");
 $("#subtitle").textContent=view?"詳細・編集":"好きな衣装を、少しずつ形に。";
 $("#app").innerHTML=tab==="home"?home():
  tab==="projects"?projects():
  tab==="masters"?masters():
  tab==="calendar"?calendarPage():
  tab==="materials"?materialsPage():settings();
}

/* カレンダー */
function calendarHTML(){
 const first=new Date(year,month,1).getDay();
 const total=new Date(year,month+1,0).getDate();
 const marks={};
 data.events.forEach(e=>{
  if(!marks[e.date])marks[e.date]={};
  marks[e.date].event=true;
 });
 data.projects.forEach(p=>walk(p,n=>{
  if(n.due){
   if(!marks[n.due])marks[n.due]={};
   marks[n.due].task=true;
  }
 }));
 let cells=["日","月","火","水","木","金","土"]
  .map(x=>`<div class="week">${x}</div>`).join("");
 for(let i=0;i<first;i++)cells+='<div class="day blank"></div>';
 for(let i=1;i<=total;i++){
  const d=`${year}-${String(month+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
  const m=marks[d]||{};
  cells+=`<button class="day ${d===today()?"today":""}
   ${d===selectedDate?"selected":""}" onclick="chooseDate('${d}')">
   ${i}<div class="dots">${m.event?'<i class="dot event"></i>':""}
   ${m.task?'<i class="dot"></i>':""}</div></button>`;
 }
 return `<div class="card">
  <div class="row between" style="margin-bottom:14px">
   <button class="btn sm alt" onclick="changeMonth(-1)">‹</button>
   <b>${year}年 ${month+1}月</b>
   <button class="btn sm alt" onclick="changeMonth(1)">›</button>
  </div>
  <div class="calendar">${cells}</div>
  <div style="margin-top:14px"><b>${fmt(selectedDate)} の予定</b>
  ${dateItems(selectedDate)}</div>
 </div>`;
}
function changeMonth(step){
 const d=new Date(year,month+step,1);
 year=d.getFullYear();month=d.getMonth();
 selectedDate=localDate(d);render();
}
function chooseDate(d){selectedDate=d;render()}
function dateItems(d){
 const events=data.events.filter(e=>e.date===d);
 const tasks=[];
 data.projects.forEach(p=>walk(p,n=>{
  if(n.due===d)tasks.push({n,p});
 }));
 if(!events.length&&!tasks.length)
  return '<div class="empty">予定はありません</div>';
 return events.map(e=>`<div class="item">🎪 ${esc(e.name)}</div>`).join("")+
 tasks.map(({n,p})=>`<div class="item">
  <button class="btn sm alt" onclick="go('projects','${p.id}')">
   📌 ${esc(n.name)} · ${esc(p.name)}</button></div>`).join("");
}

/* ホーム */
function home(){
 const active=data.projects.filter(p=>p.status!=="完了");
 const due=allDue().filter(x=>days(x.node.due)<=3);
 const tasks=[];
 data.projects.forEach(p=>walk(p,n=>{
  if(n.kind==="check"&&!n.done&&
   (data.todayIds.includes(n.id)||(n.due&&days(n.due)<=3)))
   tasks.push({n,p});
 }));
 const next=[...data.events].filter(e=>days(e.date)>=0)
  .sort((a,b)=>a.date.localeCompare(b.date))[0];
 return `<div class="card hero">
  <small>MY CREATIVE WORKSPACE</small>
  <h2 style="margin-top:9px">今日も、理想の衣装に一歩近づこう ✨</h2>
  <div class="row between">
   <span>制作中 ${active.length} 件</span>
   <button class="btn sm" style="background:white;color:#7053a0"
    onclick="openProject()">＋ 衣装を追加</button>
  </div></div>
  ${next?`<div class="card"><small>次のイベントまで</small>
   <h2>${days(next.date)}日</h2>
   <b>${esc(next.name)}</b> · ${fmt(next.date)}</div>`:""}
  <div class="section"><h2>📅 カレンダー</h2>
   <button class="btn sm alt" onclick="go('calendar')">予定を見る</button></div>
  ${calendarHTML()}
  <div class="section"><h2>今日の作業</h2></div>
  <div class="card">${tasks.length?tasks.map(({n,p})=>`
   <div class="item row">
    <input class="check" type="checkbox" onchange="toggle('${n.id}')">
    <div style="flex:1"><b>${esc(n.name)}</b><br>
    <small>${esc(p.name)}</small></div></div>`).join(""):
   '<div class="empty">今日の作業はありません</div>'}</div>
  <div class="section"><h2>⚠️ 期限が近い作業</h2></div>
  <div class="card">${due.length?due.slice(0,10).map(({node:n,project:p})=>`
   <div class="item row between">
    <div><b>${esc(n.name)}</b><br>
    <small>${esc(p.name)} · ${fmt(n.due)}</small></div>
    <button class="btn sm alt" onclick="${n.kind==="check"?
      `toggle('${n.id}')`:`go('projects','${p.id}')`}">
      ${n.kind==="check"?"✓ 完了":"開く"}</button></div>`).join(""):
   '<div class="empty">期限が近い作業はありません</div>'}</div>
  <div class="section"><h2>👗 制作中の衣装</h2>
   <button class="btn sm alt" onclick="go('projects')">すべて見る</button></div>
  ${active.map(projectCard).join("")||
   '<div class="card empty">衣装を登録してみよう！</div>'}`;
}

/* 作品・キャラクター */
function masters(){
 return `<div class="section"><h2>🎭 作品・キャラクター</h2></div>
 <div class="card"><div class="row">
 <button class="btn" onclick="simpleForm('works','作品')">＋ 作品</button>
 <button class="btn alt" onclick="characterForm()">＋ キャラクター</button>
 </div></div>
 ${data.works.map(w=>`<div class="card">
  <div class="row between"><h3>${esc(w.name)}</h3>
   <button class="btn sm alt" onclick="simpleForm('works','作品','${w.id}')">編集</button>
  </div>
  ${data.characters.filter(c=>c.workId===w.id).map(c=>`
   <div class="item row between"><span>🎭 ${esc(c.name)}</span>
   <button class="btn sm alt" onclick="characterForm('${c.id}')">編集</button>
   </div>`).join("")||'<div class="empty">キャラクター未登録</div>'}
 </div>`).join("")||'<div class="card empty">まず作品を登録してください</div>'}`;
}

/* 衣装一覧・詳細 */
function projectCard(p){
 return `<div class="card clickable" onclick="go('projects','${p.id}')"
  role="button" tabindex="0"
  onkeydown="if(event.key==='Enter')go('projects','${p.id}')">
  <div class="row between">
   <h3 style="margin:0">👗 ${esc(p.name)}</h3>${badge(p.status)}
  </div>
  <small>${esc(projectLabel(p))}</small>
  ${percent(p)}
  <div class="row between"><small>${p.due?"期限 "+fmt(p.due):"期限未設定"}</small>
  <span style="color:var(--primary)">工程を見る ›</span></div>
 </div>`;
}
function projects(){
 if(view){
  const p=get("projects",view);
  if(p)return detail(p);
 }
 return `<div class="section"><h2>衣装プロジェクト</h2>
  <button class="btn sm" onclick="openProject()">＋ 新規</button></div>
  <label class="field">衣装を検索
   <input placeholder="衣装名" value="${esc(search)}"
    oninput="search=this.value;render()"></label>
  ${data.projects.filter(p=>p.name.includes(search)).map(projectCard).join("")||
   '<div class="card empty">衣装プロジェクトはまだありません</div>'}`;
}
function detail(p){
 return `<div class="row between" style="margin-bottom:14px">
  <button class="btn sm alt" onclick="go('projects')">← 一覧へ</button>
  <button class="btn sm alt" onclick="openProject('${p.id}')">衣装を編集</button>
 </div>
 <div class="card">
  <h2>${esc(p.name)}</h2>
  <small>${esc(projectLabel(p))}</small>
  <div style="margin-top:10px">${badge(p.status)}</div>
  ${percent(p)}
  <div class="row">
   <button class="btn sm alt" onclick="templateFrom('${p.id}')">テンプレート保存</button>
   <button class="btn sm danger" onclick="removeEntity('projects','${p.id}')">ゴミ箱へ</button>
  </div>
 </div>
 <div class="section"><h2>制作対象・工程</h2>
  <button class="btn sm" onclick="addNode('${p.id}')">＋ 制作対象</button></div>
 ${kids(p).map(n=>`<div class="card">${nodeHTML(n,0)}</div>`).join("")||
  '<div class="card empty">制作対象を追加してください</div>'}
 <div class="card"><h3>🖼️ 参考画像・URL</h3>
  <input type="file" accept="image/*"
   onchange="addImage(event,'${p.id}')">
  <p><small>画像は縮小して端末内に保存されます。</small></p>
  ${(p.images||[]).map(i=>`<div class="item">
   <img class="thumb" src="${i.src}" alt="参考画像">
   <button class="btn sm danger" onclick="deleteImage('${p.id}','${i.id}')">削除</button>
  </div>`).join("")}
  <button class="btn sm alt" onclick="addReference('${p.id}')">＋ 参考URL</button>
  ${(p.urls||[]).map(u=>`<div class="item">
   <a href="${esc(u.url)}" target="_blank" rel="noopener noreferrer">
   ${esc(u.title||u.url)}</a>
   <button class="btn sm danger" onclick="deleteReference('${p.id}','${u.id}')">削除</button>
  </div>`).join("")}
 </div>
 <div class="card"><h3>📔 作業日誌</h3>
  <button class="btn sm alt" onclick="diaryForm('${p.id}')">＋ 記録</button>
  ${data.diary.filter(d=>d.projectId===p.id).map(d=>`
   <div class="item"><b>${fmt(d.date)} ${esc(d.text)}</b>
   <p>${esc(d.note)}</p>
   <button class="btn sm alt" onclick="diaryForm('${p.id}','${d.id}')">編集</button>
   </div>`).join("")}
 </div>`;
}
function nodeHTML(n,depth){
 const target=n.kind==="target";
 const process=n.kind==="process";
 const sub=n.kind==="sub";
 const check=n.kind==="check";
 const checkbox=process||sub||check;
 const checked=isDone(n);
 return `<div class="node">
  <div class="row between">
   <div class="row" style="flex:1">
    ${checkbox?`<input class="check" type="checkbox"
     ${checked?"checked":""} onchange="toggle('${n.id}')">`:""}
    <b>${esc(n.name)}</b>
   </div>
   ${process?`<select onchange="changeStatus('${n.id}',this.value)">
    ${statuses.map(s=>`<option ${n.status===s?"selected":""}>${s}</option>`).join("")}
   </select>`:target?badge(n.status):""}
  </div>
  ${target?percent(n):""}
  <div class="row" style="margin-top:9px">
   <button class="btn sm alt" onclick="openNode('${n.id}')">編集</button>
   ${depth<3?`<button class="btn sm alt" onclick="addNode('${n.id}')">
    ＋ ${["工程","サブ工程","チェック項目"][depth]}</button>`:""}
   <button class="btn sm alt" onclick="moveNode('${n.id}',-1)">↑</button>
   <button class="btn sm alt" onclick="moveNode('${n.id}',1)">↓</button>
   ${check?`<button class="btn sm alt" onclick="toggleToday('${n.id}')">
    ${data.todayIds.includes(n.id)?"今日から外す":"今日に追加"}</button>`:""}
  </div>
  ${kids(n).length?`<div class="nested">
   ${kids(n).map(c=>nodeHTML(c,depth+1)).join("")}</div>`:""}
 </div>`;
}

/* 編集フォーム */
function field(label,name,val="",type="text",required=false){
 return `<label class="field">${label}<input type="${type}" name="${name}"
  value="${esc(val)}" ${required?"required":""}></label>`;
}
function area(label,name,val=""){
 return `<label class="field">${label}<textarea name="${name}">${esc(val)}</textarea></label>`;
}
function selectField(label,name,options,val){
 return `<label class="field">${label}<select name="${name}">
 ${options.map(o=>{
  const id=o.id??o,name=o.name??o;
  return `<option value="${esc(id)}" ${String(id)===String(val)?"selected":""}>

 }).join("")}</select></label>`;
}
function commonFields(o){
 return selectField("ステータス","status",statuses,o.status||"未着手")+
 selectField("優先度","priority",priorities,o.priority||"中")+
 field("期限","due",o.due||"","date");

function modal(title,html,submit){
 $("#overlay").innerHTML=`<div class="modal"
  onclick="if(event.target===this)closeModal()">
  <div class="panel">
   <div class="row between"><h2>${esc(title)}</h2>
    <button class="btn sm alt" onclick="closeModal()">閉じる</button></div>
   <form id="editor">${html}

    <button class="btn alt" type="button" onclick="closeModal()">キャンセル</button></div>
   </form></div></div>`;
 $("#editor").onsubmit=e=>{
  e.preventDefault();submit(new FormData(e.target));
 };
}
function closeModal(){$("#overlay").innerHTML=""}

 modal("キャラクター",

function openProject(id){
 if(!data.works.length||!data.characters.length)
  return alert("先に「作品」タブで作品とキャラクターを登録してください");
 const p=get("projects",id)||{};
 const html=field("衣装名","name",p.name,"text",true)+
  selectField("作品","workId",data.works,p.workId)+
  selectField("キャラクター","characterId",data.characters,p.characterId)+
  commonFields(p)+area("メモ","note",p.note)+
  (!id?selectField("初期テンプレート","template",[
   {id:"standard",name:"標準（5つの制作対象）"},
   {id:"empty",name:"空の衣装"},
   ...data.templates
  ],"standard"):"");
 modal("衣装プロジェクト",html,f=>{
  const props={name:f.get("name"),workId:f.get("workId"),
   characterId:f.get("characterId"),status:f.get("status"),
   priority:f.get("priority"),due:f.get("due"),note:f.get("note")};
  if(!data.characters.some(c=>c.id===props.characterId&&c.workId===props.workId))
   return alert("作品とキャラクターの組み合わせが一致しません");
  if(id)Object.assign(p,props);
  else{
   const t=f.get("template");
   const nodes=t==="standard"?categories.map(n=>makeNode(n,"target")):
    t==="empty"?[]:structuredClone(get("templates",t)?.nodes||[]);
   function renew(n){
    n.id=uid();n.manual=null;n.done=false;n.status="未着手";
    kids(n).forEach(renew);
   }
   nodes.forEach(renew);
   Object.assign(p,{id:uid(),...props,kind:"project",manual:null,
    children:nodes,images:[],urls:[]});
   data.projects.push(p);
  }
  save();closeModal();go("projects",p.id);
 });
}
function addNode(parentId){
 const found=findNode(parentId);
 const parent=found?.node||get("projects",parentId);
 if(!parent)return;
 const kind={project:"target",target:"process",process:"sub",sub:"check"}[parent.kind];
 if(!kind)return;
 modal("項目の追加",
  field("名前","name","","text",true)+commonFields({}),f=>{
   const n=makeNode(f.get("name"),kind);
   n.status=f.get("status");
   n.priority=f.get("priority");
   n.due=f.get("due");
   parent.children=parent.children||[];
   parent.children.push(n);
   save();closeModal();render();
  });
}
function openNode(id){
 const r=findNode(id);
 if(!r)return;
 const n=r.node;
 modal("項目の編集",
  field("名前","name",n.name,"text",true)+
  (n.kind==="process"?commonFields(n):
   selectField("優先度","priority",priorities,n.priority||"中")+
   field("期限","due",n.due||"","date"))+
  `<button type="button" class="btn sm danger"
   onclick="deleteNode('${id}')">ゴミ箱へ</button>`,f=>{
   n.name=f.get("name");
   n.priority=f.get("priority");
   n.due=f.get("due");
   if(n.kind==="process"){
    n.status=f.get("status");
    n.done=n.status==="完了";
   }
   save();closeModal();render();
  });
}
function toggle(id){
 const r=findNode(id);
 if(!r)return;
 const n=r.node;
 if(n.kind==="target"||n.kind==="project")return;
 const next=!isDone(n);
 n.done=next;
 if(n.kind==="process"||n.kind==="check")
  n.status=next?"完了":"未着手";
 save();render();
}
function changeStatus(id,status){
 const r=findNode(id);
 if(!r)return;
 r.node.status=status;
 r.node.done=status==="完了";
 save();render();
}
function toggleToday(id){
 data.todayIds=data.todayIds.includes(id)?
  data.todayIds.filter(x=>x!==id):[...data.todayIds,id];
 save();render();
}
function moveNode(id,dir){
 const r=findNode(id);
 if(!r)return;
 const parent=parentOf(r.project,id);
 const a=parent?.children||[];
 const i=a.findIndex(x=>x.id===id),j=i+dir;
 if(j<0||j>=a.length)return;
 [a[i],a[j]]=[a[j],a[i]];
 save();render();
}
function deleteNode(id){
 const r=findNode(id);
 if(!r)return;
 const parent=parentOf(r.project,id);
 if(!parent||!confirm("この項目と配下の項目をゴミ箱へ移しますか？"))return;
 const i=parent.children.findIndex(x=>x.id===id);
 const item=parent.children.splice(i,1)[0];
 data.trash.push({id:uid(),key:"node",item,
  projectId:r.project.id,parentId:parent.id,index:i,deleted:today()});
 save();closeModal();render();
}
function removeEntity(key,id){
 if(!confirm("ゴミ箱へ移しますか？"))return;
 const a=data[key],i=a.findIndex(x=>x.id===id);
 if(i<0)return;
 data.trash.push({id:uid(),key,item:a.splice(i,1)[0],
  index:i,deleted:today()});
 if(key==="projects")view=null;
 save();render();
}

function materialsPage(){
 return `<div class="section"><h2>🧵 材料・在庫</h2>
  <button class="btn sm" onclick="materialForm()">＋ 材料</button></div>
  <div class="card"><small>割当は予約量です。実際に使用したときだけ在庫を減らします。</small>

    <small>在庫 ${m.stock||0}${esc(m.unit||"個")} /
     割当 ${reserved} / 利用可能 ${Number(m.stock||0)-reserved}</small>
    <div class="row" style="margin-top:8px">
     <button class="btn sm alt" onclick="materialForm('${m.id}')">編集</button>

function materialForm(id){
 const m=get("materials",id)||{};
 modal("材料",
  field("材料名","name",m.name,"text",true)+
  field("在庫数量","stock",m.stock??0,"number")+
  field("必要数量","needed",m.needed??0,"number")+
  field("単位","unit",m.unit||"個")+
  field("購入先","shop",m.shop)+
  field("購入URL","url",m.url,"url")+
  selectField("購入状況","purchased",[
   {id:"no",name:"未購入"},{id:"yes",name:"購入済"}
  ],m.purchased?"yes":"no"),f=>{
   const stock=Number(f.get("stock"));
   const reserved=(m.alloc||[]).reduce((s,a)=>s+Number(a.qty||0),0);
   if(!Number.isFinite(stock)||stock<reserved)
    return alert("在庫は割当量以上の数値にしてください");
   const props={name:f.get("name"),stock,
    needed:Number(f.get("needed"))||0,unit:f.get("unit"),
    shop:f.get("shop"),url:f.get("url"),
    purchased:f.get("purchased")==="yes"};
   if(id)Object.assign(m,props);
   else data.materials.push({id:uid(),...props,alloc:[]});
   save();closeModal();render();
  });
}
function allocationForm(id){
 const m=get("materials",id);
 if(!data.projects.length)return alert("先に衣装を登録してください");
 modal("材料の割当・消費",
  selectField("衣装","projectId",data.projects,data.projects[0].id)+
  field("数量","qty",1,"number")+
  selectField("操作","action",[
   {id:"reserve",name:"割当"},
   {id:"consume",name:"消費"},
   {id:"release",name:"割当解除"}
  ],"reserve"),f=>{
   const projectId=f.get("projectId"),qty=Number(f.get("qty"));
   const action=f.get("action");
   if(!Number.isFinite(qty)||qty<=0)return alert("正の数量を入力してください");
   m.alloc=m.alloc||[];
   let a=m.alloc.find(x=>x.projectId===projectId);
   if(!a){a={projectId,qty:0};m.alloc.push(a)}
   const reserved=m.alloc.reduce((s,x)=>s+Number(x.qty),0);
   if(action==="reserve"){
    if(qty>m.stock-reserved)return alert("利用可能在庫が不足しています");
    a.qty+=qty;
   }else if(action==="release"){
    if(qty>a.qty)return alert("割当量を超えています");
    a.qty-=qty;
   }else{
    if(qty>a.qty||qty>m.stock)return alert("割当または在庫が不足しています");
    a.qty-=qty;m.stock-=qty;
   }
   m.alloc=m.alloc.filter(x=>x.qty>0);
   save();closeModal();render();
  });
}

/* 画像・日誌・テンプレート */
async function addImage(e,id){
 const file=e.target.files?.[0];
 if(!file)return;
 try{
  const img=await createImageBitmap(file);
  const scale=Math.min(1,1600/Math.max(img.width,img.height));
  const canvas=document.createElement("canvas");
  canvas.width=Math.round(img.width*scale);
  canvas.height=Math.round(img.height*scale);
  canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
  get("projects",id).images.push({
   id:uid(),src:canvas.toDataURL("image/jpeg",.82)
  });
  img.close?.();
  await save();render();
 }catch(err){alert("画像を追加できませんでした: "+err.message)}
}

/* 設定・バックアップ・ゴミ箱 */
function settings(){
 return `<div class="section"><h2>⚙️ 設定・データ保護</h2></div>
 <div class="card"><h3>JSONバックアップ</h3>
  <p><small>画像を含めて書き出します。iCloud Driveなどに保存してください。</small></p>
  <button class="btn" onclick="backup()">JSONを書き出す</button>
  <label class="field">JSONから復元
   <input type="file" accept=".json,application/json" onchange="restore(event)">
  </label>
  <small>復元は現在のデータを置き換えます。</small>
 </div>
 <div class="card"><h3>テンプレート</h3>
  ${data.templates.map(t=>`<div class="item row between">
   <span>${esc(t.name)}</span>
   <button class="btn sm danger" onclick="removeEntity('templates','${t.id}')">削除</button>
  </div>`).join("")||'<div class="empty">テンプレートなし</div>'}
 </div>
 <div class="card"><h3>ゴミ箱</h3>
  ${data.trash.map(t=>`<div class="item row between">
   <div><b>${esc(t.item.name||t.item.text||"項目")}</b><br>
    <small>${fmt(t.deleted)}</small></div>
   <button class="btn sm alt" onclick="recover('${t.id}')">復元</button>
   <button class="btn sm danger" onclick="purge('${t.id}')">完全削除</button>
  </div>`).join("")||'<div class="empty">ゴミ箱は空です</div>'}
 </div>
 <div class="card"><h3>アプリについて</h3>
  <p>Cosplay Craft Manager v1.2</p>
  <small>保存先：iPhone内のIndexedDB。Safariのサイトデータ削除などで
   消える可能性があります。定期的にバックアップしてください。</small>
 </div>`;
}
function backup(){
 const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="CosplayCraftManager_"+today().replaceAll("-","")+".json";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 toast("バックアップをファイルに保存してください");
}
async function restore(e){
 const file=e.target.files?.[0];
 if(!file)return;
 try{
  const incoming=JSON.parse(await file.text());
  if(!Array.isArray(incoming.projects)||!Array.isArray(incoming.works))
   throw Error("JSONの形式が異なります");
  if(!confirm("現在のデータをすべて置き換えます。バックアップ済みですか？"))
   return;
  data={...blank(),...incoming};
  await save();render();toast("復元しました");
 }catch(err){alert("復元に失敗しました: "+err.message)}
}
function recover(id){
 const i=data.trash.findIndex(t=>t.id===id);
 if(i<0)return;
 const t=data.trash[i];
 if(t.key==="node"){
  const p=get("projects",t.projectId);
  const parent=p&&(p.id===t.parentId?p:findNode(t.parentId)?.node);
  if(!parent)return alert("復元先の親項目がありません");
  parent.children.splice(Math.min(t.index,parent.children.length),0,t.item);
 }else{
  data[t.key].splice(Math.min(t.index,data[t.key].length),0,t.item);
 }
 data.trash.splice(i,1);
 save();render();
}
function purge(id){
 if(!confirm("完全削除します。元に戻せません。よろしいですか？"))return;
 data.trash=data.trash.filter(t=>t.id!==id);
 save();render();
}

(async()=>{

   navigator.serviceWorker.register("./sw.js").catch(console.warn);

  $("#app").innerHTML=`<div class="card">
   保存領域を利用できません。Safariの通常モードで開いてください。
   </div>`;
  console.error(err);
 }
})();
